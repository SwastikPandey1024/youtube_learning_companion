[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Project metadata ─────────────────────────────────────────────────────────
[project]
name = "youtube_learning_companion"
version = "0.1.0"
description = "YouTube Learning Companion — Evidence-grounded lecture note synthesis, transcript auditing, and playlist orchestration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["youtube", "learning", "study-notes", "education", "gate", "llm-synthesis"]

dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

# ── Package layout (src/) ────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/youtube_learning_companion"]

# ── Ruff — linting + formatting ──────────────────────────────────────────────
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # bandit (security)
]
ignore = [
    "S101",    # assert used — we use it in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy — type checking ─────────────────────────────────────────────────────
[tool.mypy]
plugins = ["pydantic.mypy"]
mypy_path = "src"
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
pretty = true

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["-v", "--tb=short"]
